name: SEO build check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Verify generated SEO assets
        run: |
          test -f public/sitemap.xml
          test -f public/llms.txt
          grep -q "nexiscro.com/blog/" public/sitemap.xml
          grep -q "Shopify AEO" public/llms.txt || grep -q "Guides" public/llms.txt
          echo "sitemap URLs: $(grep -c '<loc>' public/sitemap.xml)"
          echo "llms.txt lines: $(wc -l < public/llms.txt)"
